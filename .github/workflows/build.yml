name: Build ARM64

on:
  push:
    branches: [feat/cpp-rewrite, main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-arm64:
    name: Build ARM64 (Raspberry Pi)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 binary
        run: |
          # Build using Docker with ARM64 emulation
          docker build \
            --platform linux/arm64 \
            -f Dockerfile.arm64 \
            -t multipack-builder-arm64 \
            .
          
          # Create output directory
          mkdir -p output
          
          # Extract binary from container
          CONTAINER_ID=$(docker create multipack-builder-arm64)
          docker cp "$CONTAINER_ID:/app/build/bin/multipack-parser" output/
          docker rm "$CONTAINER_ID"
          
          # Build a portable runtime directory (multipack-parser + lib + plugins + run.sh)
          docker run --rm \
            --platform linux/arm64 \
            -v "$(pwd):/work" \
            -v "$(pwd)/output:/output" \
            multipack-builder-arm64 \
            bash -c '
              bash /work/scripts/bundle_linux_portable.sh \
                --binary /output/multipack-parser \
                --output-dir /output/bundle
            '

          # Package updater payload (kept for AutoUpdater compatibility)
          tar -czvf output/multipack-parser-arm64.tar.gz -C output/bundle .

          # Build single-file portable launcher
          bash scripts/create_portable_single_file.sh \
            --bundle-dir output/bundle \
            --output-file output/multipack-parser-arm64-portable.run

          # Generate unsigned manifest for build artifacts (release signing happens in release job)
          APP_VERSION=$(grep -E 'constexpr const char\* VERSION' include/multipack/config/ConfigDefaults.h | sed -E 's/.*"([^"]+)".*/\1/')
          cd output
          python3 ../scripts/generate_update_metadata.py \
            --package multipack-parser-arm64.tar.gz \
            --version "$APP_VERSION" \
            --output-manifest multipack-parser-arm64-manifest.json
          
          # Show contents
          echo "=== Package contents ==="
          tar -tzvf multipack-parser-arm64.tar.gz
          echo "=== Binary info ==="
          file bundle/multipack-parser
          ls -lh multipack-parser-arm64.tar.gz
          ls -lh multipack-parser-arm64-portable.run
          ls -lh multipack-parser-arm64-manifest.json

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: multipack-parser-arm64
          path: |
            output/multipack-parser-arm64.tar.gz
            output/multipack-parser-arm64-portable.run
            output/multipack-parser-arm64-manifest.json
          retention-days: 30

  # Optional: Create release on tag push
  release:
    name: Create Release
    needs: build-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: multipack-parser-arm64

      - name: Generate signed release metadata
        run: |
          if [ -z "${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}" ]; then
            echo "Missing required secret: UPDATE_SIGNING_PRIVATE_KEY_B64"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/multipack-parser-arm64.tar.gz"

          echo "${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}" | base64 -d > update-signing-private.pem
          chmod 600 update-signing-private.pem

          python3 scripts/generate_update_metadata.py \
            --package multipack-parser-arm64.tar.gz \
            --version "$TAG_VERSION" \
            --package-url "$PACKAGE_URL" \
            --output-manifest multipack-parser-arm64-manifest.json \
            --signing-key update-signing-private.pem \
            --output-signature multipack-parser-arm64-manifest.sig

          rm -f update-signing-private.pem

          ls -lh multipack-parser-arm64.tar.gz multipack-parser-arm64-manifest.json multipack-parser-arm64-manifest.sig

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            multipack-parser-arm64.tar.gz
            multipack-parser-arm64-portable.run
            multipack-parser-arm64-manifest.json
            multipack-parser-arm64-manifest.sig
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
