name: Build ARM64

on:
  push:
    branches: [feat/cpp-rewrite, main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-arm64:
    name: Build ARM64 (Raspberry Pi)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 binary
        run: |
          # Build using Docker with ARM64 emulation
          docker build \
            --platform linux/arm64 \
            -f Dockerfile.arm64 \
            -t multipack-builder-arm64 \
            .
          
          # Create output directory
          mkdir -p output
          
          # Extract binary and libraries from container
          CONTAINER_ID=$(docker create multipack-builder-arm64)
          docker cp "$CONTAINER_ID:/app/build/bin/multipack-parser" output/
          docker cp "$CONTAINER_ID:/app/build/lib" output/ 2>/dev/null || true
          docker rm "$CONTAINER_ID"
          
          # Bundle Qt libraries
          docker run --rm \
            --platform linux/arm64 \
            -v "$(pwd)/output:/output" \
            multipack-builder-arm64 \
            bash -c '
              mkdir -p /output/lib
              
              # Copy Qt libraries
              for lib in libQt6Core libQt6Gui libQt6Widgets libQt6Network libQt6Sql libQt6Multimedia libQt6DBus libQt6XcbQpa libQt6OpenGL; do
                find /usr/lib -name "${lib}.so*" -exec cp -a {} /output/lib/ \; 2>/dev/null || true
              done
              
              # Copy Qt plugins
              mkdir -p /output/plugins
              cp -r /usr/lib/*/qt6/plugins/platforms /output/plugins/ 2>/dev/null || true
              cp -r /usr/lib/*/qt6/plugins/sqldrivers /output/plugins/ 2>/dev/null || true
              cp -r /usr/lib/*/qt6/plugins/multimedia /output/plugins/ 2>/dev/null || true
              
              # Copy ICU libraries
              find /usr/lib -name "libicu*.so*" -exec cp -a {} /output/lib/ \; 2>/dev/null || true
              
              # Copy other dependencies
              for lib in libpcre2-16 libdouble-conversion libxcb libxkbcommon libX11 libXext libXcursor libXfixes libXi libXrandr libXrender libXinerama; do
                find /usr/lib -name "${lib}.so*" -exec cp -a {} /output/lib/ \; 2>/dev/null || true
              done
            '
          
          # Create run script
          cat > output/run.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$SCRIPT_DIR/plugins"
          
          # Force X11 for Openbox environments
          export QT_QPA_PLATFORM=xcb
          export QT_X11_NO_MITSHM=1
          export LIBGL_ALWAYS_SOFTWARE=1
          
          exec "$SCRIPT_DIR/multipack-parser" "$@"
          EOF
          chmod +x output/run.sh
          
          # Create qt.conf to help Qt find plugins and libraries
          cat > output/qt.conf << 'EOF'
          [Paths]
          Prefix = .
          Plugins = plugins
          Libraries = lib
          EOF
          chmod +x output/run.sh
          
          # Package everything
          cd output
          tar -czvf multipack-parser-arm64.tar.gz multipack-parser lib plugins run.sh

          # Generate unsigned manifest for build artifacts (release signing happens in release job)
          APP_VERSION=$(grep -E 'constexpr const char\* VERSION' ../include/multipack/config/ConfigDefaults.h | sed -E 's/.*"([^"]+)".*/\1/')
          python3 ../scripts/generate_update_metadata.py \
            --package multipack-parser-arm64.tar.gz \
            --version "$APP_VERSION" \
            --output-manifest multipack-parser-arm64-manifest.json
          
          # Show contents
          echo "=== Package contents ==="
          tar -tzvf multipack-parser-arm64.tar.gz
          echo "=== Binary info ==="
          file multipack-parser
          ls -lh multipack-parser-arm64.tar.gz
          ls -lh multipack-parser-arm64-manifest.json

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: multipack-parser-arm64
          path: |
            output/multipack-parser-arm64.tar.gz
            output/multipack-parser-arm64-manifest.json
          retention-days: 30

  # Optional: Create release on tag push
  release:
    name: Create Release
    needs: build-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: multipack-parser-arm64

      - name: Generate signed release metadata
        run: |
          if [ -z "${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}" ]; then
            echo "Missing required secret: UPDATE_SIGNING_PRIVATE_KEY_B64"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/multipack-parser-arm64.tar.gz"

          echo "${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}" | base64 -d > update-signing-private.pem
          chmod 600 update-signing-private.pem

          python3 scripts/generate_update_metadata.py \
            --package multipack-parser-arm64.tar.gz \
            --version "$TAG_VERSION" \
            --package-url "$PACKAGE_URL" \
            --output-manifest multipack-parser-arm64-manifest.json \
            --signing-key update-signing-private.pem \
            --output-signature multipack-parser-arm64-manifest.sig

          rm -f update-signing-private.pem

          ls -lh multipack-parser-arm64.tar.gz multipack-parser-arm64-manifest.json multipack-parser-arm64-manifest.sig

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            multipack-parser-arm64.tar.gz
            multipack-parser-arm64-manifest.json
            multipack-parser-arm64-manifest.sig
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
